# EgQE を GitHub Pages に公開する（全文検索の索引づくり付き）
# 流れ：md から索引を作る → GitHub Pages と同じ Jekyll で HTML にする → 公開
# 使うには：Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: Deploy EgQE (with search)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # 6時間ごとに公開し直す（Living RACK の新着と、届いた言及を取りに行くため）
  workflow_dispatch:

permissions:
  contents: write   # 届いた言及（webmentions.json）を箱に残すため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build search index
        run: python3 tools/build_search_index.py docs
      - name: Refresh Living RACK (note RSS)
        run: python3 tools/update_rack.py docs/rack/rack.json
        continue-on-error: true   # noteが応答しなくても、サイトの公開は止めない
        env:
          LISTEN_FEED: ${{ secrets.LISTEN_FEED }}
      - name: Refresh webmentions (webmention.io)
        run: python3 tools/update_webmentions.py docs/rack/webmentions.json docs/rack/webmentions-hide.txt
        continue-on-error: true   # webmention.io が応答しなくても、サイトの公開は止めない
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
      - name: Keep webmentions in the box (only when changed)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rack/webmentions.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Collect webmentions"
          git push || (git pull --rebase --autostash && git push)
      - name: Build with Jekyll (same as classic GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
