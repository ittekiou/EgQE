# Living RACK の新着を、6時間ごとにnoteのRSSから取りに行く。
# 棚の台帳：docs/rack/rack.json　更新スクリプト：tools/update_rack.py
name: update-rack

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch RSS and update rack.json
        run: python3 tools/update_rack.py docs/rack/rack.json
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/rack/rack.json; then
            echo "no change"; exit 0
          fi
          git config user.name "living-rack-bot"
          git config user.email "living-rack-bot@users.noreply.github.com"
          git add docs/rack/rack.json
          git commit -m "rack: 新着を更新"
          git push
          gh workflow run pages.yml --ref main
