<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living RACK｜noteマガジン書庫</title>
<meta name="description" content="束はnoteに。表紙はここに。一狄 啓のnoteマガジンを、表紙を向けて並べる書庫。">
<style>
  :root{
    --bg:#f4efe6; --paper:#fbf8f2; --ink:#2b2621; --sub:#6f665c; --line:#ddd3c4;
    --wood:#8a6a48; --accent:#2f6b3a; --tag:#efe5d3; --shadow:0 1px 2px rgba(60,40,20,.08),0 6px 18px rgba(60,40,20,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1d1b18; --paper:#26231f; --ink:#ece6dc; --sub:#a59c90; --line:#3a352e;
      --wood:#b38c62; --accent:#7fc08a; --tag:#332e27; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
  header h1{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:600;
    font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:.02em}
  header .sub{color:var(--sub);margin:4px 0 0}
  header .motto{margin:14px 0 0;font-size:15px}
  header .motto b{font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:24px 0 8px}
  .bar button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    padding:6px 14px;border-radius:999px;cursor:pointer}
  .bar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .bar .stamp{margin-left:auto;color:var(--sub);font-size:13px}
  .shelf{margin-top:34px}
  .shelf h2{font-size:18px;margin:0;font-weight:600}
  .shelf .note{color:var(--sub);font-size:13px;margin:2px 0 12px}
  .board{border-bottom:6px solid var(--wood);border-radius:0 0 3px 3px;padding-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .cover{display:block;aspect-ratio:1.91/1;background:var(--tag);position:relative;overflow:hidden;text-decoration:none}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;
    font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:15px;color:var(--sub)}
  .cover .flag{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:11px;
    padding:2px 8px;border-radius:999px;letter-spacing:.05em}
  .cover .auto{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 6px;border-radius:3px}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .body h3{font-size:15px;margin:0;line-height:1.45}
  .body h3 a{text-decoration:none}
  .body h3 a:hover{text-decoration:underline}
  .desc{font-size:13px;color:var(--sub);margin:0}
  .meta{font-size:12px;color:var(--sub)}
  .latest{list-style:none;margin:6px 0 0;padding:8px 0 0;border-top:1px dashed var(--line);font-size:13px}
  .latest li{display:flex;gap:8px;align-items:baseline;margin:3px 0}
  .latest time{flex:none;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}
  .latest a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .latest a:hover{text-decoration:underline}
  footer{margin-top:56px;color:var(--sub);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
  footer p{margin:4px 0}
  .err{background:var(--paper);border:1px solid var(--line);padding:16px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Living RACK</h1>
    <p class="sub" id="subtitle">noteマガジン書庫</p>
    <p class="motto"><b>束はnoteに。表紙はここに。</b>　表紙と棚は手で並べる。新着は勝手に届く。</p>
  </header>

  <div class="bar" role="group" aria-label="並べ方">
    <button data-view="shelf" aria-pressed="true">棚ごと</button>
    <button data-view="recent" aria-pressed="false">新着順</button>
    <button data-view="all" aria-pressed="false">ぜんぶ</button>
    <span class="stamp" id="stamp"></span>
  </div>

  <main id="rack"></main>

  <footer>
    <p>No Rail. No Track. Next Nest.</p>
    <p>Now Emulsifying! ／ Half-Cooked, Always. ／ Stocked, Stirred, Fermented.</p>
    <p>共同の野良ラックは <a href="https://www.are.na/dream-no-track-kuykyopogvu/note-rack">note RACK｜Are.na</a> へ。</p>
  </footer>
</div>

<script>
(() => {
  const NEW_DAYS = 7;
  const $rack = document.getElementById('rack');
  let data = null, view = 'shelf';
  try { view = localStorage.getItem('rack-view') || 'shelf'; } catch (e) {}

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ymd = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
  const isNew = iso => iso && (Date.now() - new Date(iso)) < NEW_DAYS * 864e5;

  function card(m) {
    const fallback = !m.cover && m.latest && m.latest[0] && m.latest[0].thumb;
    const img = m.cover || fallback;
    const cover = img
      ? `<span class="ph">${esc(m.title)}</span><img src="${esc(img)}" alt="" loading="lazy" style="position:relative" onerror="this.remove()">${fallback ? '<span class="auto">最新記事の画像</span>' : ''}`
      : `<span class="ph">${esc(m.title)}</span>`;
    const latest = (m.latest || []).slice(0, 3).map(a =>
      `<li><time datetime="${esc(a.date)}">${ymd(a.date)}</time><a href="${esc(a.url)}">${esc(a.title)}</a></li>`).join('');
    const meta = [m.count != null ? `${m.count}本` : '', m.latest_at ? `最終更新 ${ymd(m.latest_at)}` : ''].filter(Boolean).join('　');
    return `<article class="card">
      <a class="cover" href="${esc(m.url)}" aria-label="${esc(m.title)}">${cover}${isNew(m.latest_at) ? '<span class="flag">入荷</span>' : ''}</a>
      <div class="body">
        <h3><a href="${esc(m.url)}">${esc(m.title)}</a></h3>
        ${m.description ? `<p class="desc">${esc(m.description)}</p>` : ''}
        ${meta ? `<div class="meta">${meta}</div>` : ''}
        ${latest ? `<ul class="latest">${latest}</ul>` : ''}
      </div></article>`;
  }

  const grid = list => `<div class="grid">${list.map(card).join('')}</div>`;

  function render() {
    const mags = data.magazines;
    let html = '';
    if (view === 'shelf') {
      for (const s of data.shelves) {
        const list = mags.filter(m => m.shelf === s.id).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
        if (!list.length) continue;
        html += `<section class="shelf"><h2>${esc(s.name)}</h2>${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}<div class="board">${grid(list)}</div></section>`;
      }
      const loose = mags.filter(m => !data.shelves.some(s => s.id === m.shelf));
      if (loose.length) html += `<section class="shelf"><h2>🌱 まだ棚のないもの</h2><div class="board">${grid(loose)}</div></section>`;
    } else if (view === 'recent') {
      const list = [...mags].sort((a, b) => (b.latest_at ? Date.parse(b.latest_at) : 0) - (a.latest_at ? Date.parse(a.latest_at) : 0));
      html = `<section class="shelf"><h2>🍮 新着順</h2><p class="note">記事が最近届いた順。手で決めた棚の並びは、そのまま残っています。</p><div class="board">${grid(list)}</div></section>`;
    } else {
      const list = [...mags].sort((a, b) => a.title.localeCompare(b.title, 'ja'));
      html = `<section class="shelf"><h2>📚 ぜんぶ</h2><p class="note">${mags.length}冊</p><div class="board">${grid(list)}</div></section>`;
    }
    $rack.innerHTML = html;
    document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  }

  document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => {
    view = b.dataset.view;
    try { localStorage.setItem('rack-view', view); } catch (e) {}
    render();
  }));

  fetch('rack.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => {
      data = j;
      if (j.title) document.getElementById('title').textContent = j.title;
      if (j.subtitle) document.getElementById('subtitle').textContent = j.subtitle;
      if (j.updated) document.getElementById('stamp').textContent = `棚の最終更新 ${ymd(j.updated)}`;
      render();
    })
    .catch(() => {
      $rack.innerHTML = '<p class="err">rack.json を読み込めませんでした。GitHub Pages など、Webサーバーの上で開いてください（ファイルを直接ダブルクリックすると読めません）。</p>';
    });
})();
</script>
</body>
</html>
