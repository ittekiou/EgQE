<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noTon｜noteマガジンのトンネル問屋</title>
<meta name="description" content="noteマガジンのトンネル問屋。記事は動かない。マガジンがつながる。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://camp-us.net/noton/">
<meta property="og:title" content="noTon｜noteマガジンのトンネル問屋">
<meta property="og:description" content="記事は動かない。マガジンがつながる。">
<style>
  /* 色は LiRax（/rack/）・RT.Pics（/pics/）・Stall（/stall/）とそろえる */
  :root{
    --bg:#f4efe6; --paper:#fbf8f2; --ink:#2b2621; --sub:#6f665c; --line:#ddd3c4;
    --wood:#8a6a48; --tag:#efe5d3; --shadow:0 1px 2px rgba(60,40,20,.08),0 6px 18px rgba(60,40,20,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1d1b18; --paper:#26231f; --ink:#ece6dc; --sub:#a59c90; --line:#3a352e;
      --wood:#b38c62; --tag:#332e27; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
  a{color:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:28px 16px 64px}
  header h1{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:600;
    font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:.02em}
  header .sub{color:var(--sub);margin:4px 0 0}
  header .motto{margin:14px 0 0;font-size:15px}
  header .mini{margin:6px 0 0;font-size:12px;color:var(--sub)}
  header .mini a,header .mini button{color:var(--sub)}
  header .mini button{font:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
  /* 双子星：LiRax と RT.Pics の対の札（両ページ共通） */
  .twins{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;padding:0;list-style:none}
  .twins a{display:inline-flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;
    border:1px solid var(--wood);color:var(--wood);background:var(--paper);text-decoration:none;font-size:14px;line-height:1.4}
  .twins a small{font-size:11px;opacity:.85}
  .twins a:hover{background:var(--tag)}
  .twins a[aria-current="page"]{background:var(--wood);color:var(--bg);cursor:default}

  /* 帳場：Are.na でつないだ順のまま */
  .mat{margin-top:28px;border-bottom:6px solid var(--wood);border-radius:0 0 3px 3px;padding-bottom:22px;
    display:grid;grid-template-columns:repeat(2,1fr);gap:28px 24px}
  @media (max-width:640px){ .mat{grid-template-columns:1fr;gap:24px} }
    .ware{display:block;text-decoration:none}
  .ware .fr{display:block;background:var(--tag);border-radius:3px;overflow:hidden;box-shadow:var(--shadow);
    position:relative;aspect-ratio:1/1}
  .ware .fr img{width:100%;height:100%;object-fit:contain;display:block}  /* マガジンの中身（Are.na が撮ったページ）を、切らずに大きく見せる */
  .ware .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:10px;
    text-align:center;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:13px;color:var(--sub)}
  .ware.noimg .ph{display:flex}
  .ware.noimg img{display:none}
  .ware .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px;line-height:1.5;margin-top:8px}
  .ware:hover .t{text-decoration:underline}
  /* 絵のないカード（文字だけのカード・ほかのチャンネルへのつなぎ）は、帳場の下に札として並べる */
  .slips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .slip{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-left:3px solid var(--wood);
    background:var(--paper);border-radius:2px;text-decoration:none;font-size:13px;color:var(--ink)}
  .slip:hover{background:var(--tag)}

  .err{color:var(--sub);grid-column:1/-1}
  .note{color:var(--sub);font-size:13px;margin:14px 0 0}
  footer{margin-top:36px;font-size:12px;color:var(--sub)}
  footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>noTon</h1>
    <p class="sub">noteマガジンのトンネル問屋｜note RACK</p>
    <p class="motto">記事は動かない。マガジンがつながる。</p>
    <ul class="twins" aria-label="姉妹のページ"><li><a href="/rack/">📚 LiRax <small>新着順</small></a></li><li><a href="/pics/">🧺 RT.Pics <small>遭遇順</small></a></li><li><a href="/stall/">🏕️ Stall <small>陳列順</small></a></li><li><a href="/noton/" aria-current="page">🐽 noTon <small>接続順</small></a></li></ul>
  </header>

  <main id="mat" class="mat"><p class="err">トンネルをつないでいます…</p></main>
  <p class="note">マガジンを押すと、note のマガジンへ。並びは Are.na の note RACK につないだ順。</p>

  <footer>
    noTon｜noteマガジンのトンネル問屋　·　マガジンと絵は <a href="https://www.are.na/dream-no-track-kuykyopogvu/note-rack">Are.na の note RACK</a> から。
  </footer>
</div>

<script>
(() => {
  const SRC = '/rack/rack.json';   // LiRax の台帳をそのまま読む
  const ROW = 'noton';              // 台帳の "position": "noton" の段（LiRax には並ばない）
  const $mat = document.getElementById('mat');
  let wares = [];

  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function rnd(n) {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    catch (e) { return Math.floor(Math.random() * n); }
  }
  function shuffled(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  const CHANNEL = 'https://www.are.na/dream-no-track-kuykyopogvu/note-rack';
  // 行き先が外の住所でなければ（文字だけのカードなど）、note RACK のチャンネルへ
  const go = u => (/^https?:\/\//.test(u || '') && !/camp-us\.net/.test(u)) ? u : CHANNEL;

  function tile(x) {
    return `<a class="ware" href="${esc(go(x.url))}">
      <span class="fr"><img src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy"><span class="ph">${esc(x.title)}</span></span>
      <span class="t">${esc(x.title)}</span>
    </a>`;
  }
  const slip = x => `<a class="slip" href="${esc(go(x.url))}">${esc(x.title)}</a>`;

  function lay(list) {
    if (!list.length) { $mat.innerHTML = '<p class="err">いま帳場にマガジンがありません。<a href="/rack/">LiRax</a> へどうぞ。</p>'; return; }
    const withImg = list.filter(x => x.image), without = list.filter(x => !x.image);
    $mat.innerHTML = withImg.map(tile).join('') + (without.length ? `<div class="slips">${without.map(slip).join('')}</div>` : '');
    $mat.querySelectorAll('.ware img').forEach(img => img.addEventListener('error', () => img.closest('.ware').classList.add('noimg')));
  }


  fetch(SRC, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => {
      const row = (j.rows || []).find(r => r.id === ROW) || {};
      wares = (row.items || []).filter(x => x.title);
      lay(wares);                     // Are.na でつないだ順
    })
    .catch(() => { $mat.innerHTML = '<p class="err">LiRax の台帳（/rack/rack.json）を読めませんでした。Webサーバーの上で開いてください。</p>'; });
})();
</script>
</body>
</html>
